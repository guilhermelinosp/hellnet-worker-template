apiVersion: apps/v1
kind: Deployment
metadata:
  name: hellnet-worker-template
  namespace: fast
  labels:
    app.kubernetes.io/instance: hellnet-worker-template
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: hellnet-worker-template
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: hellnet-worker-template
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hellnet-worker-template
          image: ghcr.io/guilhermelinosp/hellnet-worker-template
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: hellnet-worker-template
          env:
            - name: HELLNET_SERVICE
              value: hellnet-worker-template
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
