name: pr-check


concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lint:
    uses: guilhermelinosp/templates/.github/workflows/shellcheck.yml@a1832eaf4e702dfb6d38e4051c9821c31ee58a97

  merge-check:
    uses: guilhermelinosp/templates/.github/workflows/merge-check.yml@a1832eaf4e702dfb6d38e4051c9821c31ee58a97

  gitleaks:
    uses: guilhermelinosp/templates/.github/workflows/gitleaks.yml@a1832eaf4e702dfb6d38e4051c9821c31ee58a97

  labeler:
    uses: guilhermelinosp/templates/.github/workflows/labeler.yml@a1832eaf4e702dfb6d38e4051c9821c31ee58a97
    with:
      app-client-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
    secrets: inherit

  # Single-import Go quality + security gate (see ci-templates/go-quality):
  # module integrity, vet, race tests + coverage, canonical lint, build,
  # dependency review on PRs.
  go-quality:
    uses: guilhermelinosp/templates/.github/workflows/go-quality.yml@a1832eaf4e702dfb6d38e4051c9821c31ee58a97
    with:
      go-version-file: go.mod

  pr-gate:
    if: always()
    needs: [lint, merge-check, gitleaks, labeler, go-quality]
    runs-on: ubuntu-latest
    steps:
      - name: gate
        shell: python
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          import json, os, sys
          needs = json.loads(os.environ['NEEDS'])
          failed = [k for k, v in needs.items() if v.get('result') not in ('success', 'skipped')]
          if failed:
              print('BLOCKED-BY:', failed)
              sys.exit(1)
          print('ALL-GREEN')
